  @font-face {

  }

  /* Styl ogólny dla całej strony */
  body {
    font-family: "Cinzel-Medium", serif; /* Ustawienie czcionki strony */
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
  }
  th, td {
    border: 1px solid #444;
    padding: 10px;
    text-align: center;
    font-size: 14px;
  }
  th {
    background-color: #9b2226;
    color: white;
  }

  /* Styl przycisku */
  .back-button {
    background-color: #9b2226; /* Czerwony kolor przycisku */
    color: white; /* Kolor tekstu */
    font-size: 16px; /* Rozmiar czcionki */
    padding: 12px 20px; /* Wewnętrzna przestrzeń */
    border: none; /* Bez obramowania */
    border-radius: 8px; /* Zaokrąglone rogi */
    cursor: pointer; /* Kursor wskazujący na możliwość kliknięcia */
    text-align: center; /* Wyrównanie tekstu */
    transition: background-color 0.3s ease, transform 0.3s ease; /* Animacje zmiany tła i przekształcenia */
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2); /* Cień wokół przycisku */
    font-family: "Cinzel-Medium", serif; /* Czcionka przycisku */
  }

  .back-button:hover {
    background-color: #7a1d22; /* Ciemniejszy odcień przy najechaniu */
    transform: translateY(-3px); /* Przemieszczenie przycisku w górę podczas najechania */
  }

  .back-button:active {
    background-color: #62121c; /* Jeszcze ciemniejszy odcień przy kliknięciu */
    transform: translateY(1px); /* Przemieszczenie przycisku w dół przy kliknięciu */
  }

  .back-button:focus {
    outline: none; /* Usunięcie obramowania fokusu */
    box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.6); /* Złoty obrys przy fokusie */
  }

  h2 {
    color: #FFD700; /* Złoty kolor */
    text-align: center; /* Wyrównanie tekstu na środku */
    font-size: 24px; /* Rozmiar czcionki */
    font-weight: bold; /* Pogrubienie tekstu */
    margin-top: 20px; /* Odstęp od góry */
    border-bottom: 2px solid #b8860b;
  }

  .news-item {
    width: 80%;
    margin: 20px auto;
    padding: 20px;
    background-color: #fff8dc;
    border-radius: 12px;
    border: 2px solid #d4af37;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    text-align: left;
  }

  .news-item h3 {
    color: #d4af37;
    font-size: 18px;
    margin-bottom: 10px;
    border-bottom: 2px solid #b8860b;
    padding-bottom: 5px;
  }

  .news-item p {

</style>
