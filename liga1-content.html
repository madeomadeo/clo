<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Najlepsza 8 świata</title>
  <style>
    body {
      font-family: 'Cinzel-Medium', serif;
      background-color: #f4f0e4;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .content {
      max-width: 900px;
      margin: 40px auto;
      padding: 40px;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .round-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .round-buttons button {
      background-color: #d4af37;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      color: black;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .round-buttons button:hover {
      background-color: #b8860b;
      color: white;
    }
    #dynamic-content {
      padding: 20px;
      background-color: #ffffff;
      margin-top: 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<div class="content">
  <h2 style="color: #ffd700;">Najlepsza 8 świata</h2>
  <p>Witamy w lidze Najlepsza 8 świata. Tutaj grają najlepsi z najlepszych!</p>

  <!-- Przycisk do wczytania R1 -->
  <div class="round-buttons">
    <button id="loadR1Button">Przejdź do R1</button>
  </div>

  <div id="dynamic-content">
    <!-- Tutaj będzie dynamicznie ładowana zawartość -->
  </div>
</div>

<script>
  // Obsługa kliknięcia w przycisk "R1"
  document.getElementById("loadR1Button").addEventListener("click", function() {
    loadContent('R1.html'); // Wczytuje zawartość z pliku R1.html
  });

  // Funkcja wczytująca zawartość z pliku HTML i wstawiająca ją do #dynamic-content
  function loadContent(page) {
    fetch(page)
      .then(response => {
        if (response.ok) {
          return response.text();
        } else {
          throw new Error('Błąd ładowania pliku: ' + page);
        }
      })
      .then(data => {
        document.getElementById('dynamic-content').innerHTML = data;
      })
      .catch(error => {
        console.error(error);
        document.getElementById('dynamic-content').innerHTML = '<p>Wystąpił błąd podczas ładowania zawartości.</p>';
      });
  }
</script>

</body>
</html>
